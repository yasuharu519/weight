name: Update metrics data

on:
  repository_dispatch:
    types: [weight_updated, sleep_updated]
  schedule:
    - cron: "0 0 * * *" # フォールバック: 毎日 JST 9:00
  workflow_dispatch: {}

concurrency:
  group: update-metrics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get last synced datetime
        id: last_date
        run: |
          if [ -f data.jsonl ]; then
            last=$(tail -1 data.jsonl | jq -r '.datetime')
            echo "datetime=${last}" >> "$GITHUB_OUTPUT"
          else
            echo "datetime=2024-03-19 00:00:00+09:00" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new data from D1
        id: fetch
        run: |
          response=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database/${{ secrets.D1_DATABASE_ID }}/query" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"sql\": \"SELECT measured_at, weight, fat_mass, fat_ratio, fat_free_mass, muscle_mass, hydration, bone_mass, visceral_fat, basal_metabolic_rate, metabolic_age FROM weight_measurements WHERE measured_at > ? ORDER BY measured_at ASC\", \"params\": [\"${{ steps.last_date.outputs.datetime }}\"]}")

          count=$(echo "$response" | jq '.result[0].results | length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "$response" | jq -c '.result[0].results[] | {
              "datetime": .measured_at,
              "weight": .weight,
              "fat": .fat_mass,
              "fat_ratio": .fat_ratio,
              "fat_free_mass": .fat_free_mass,
              "muscle_mass": .muscle_mass,
              "hydration": .hydration,
              "bone_mass": .bone_mass,
              "visceral_fat": .visceral_fat,
              "basal_metabolic_rate": .basal_metabolic_rate,
              "metabolic_age": .metabolic_age
            }' >> data.jsonl

            # 最新データを取得（通知用）
            # 体組成が計測されなかった場合は null になるため、null なら "-" を返す
            round2='if . == null then "-" else (. * 100 | round) / 100 end'
            latest_weight=$(echo "$response" | jq -r ".result[0].results[-1].weight | ${round2}")
            latest_fat_ratio=$(echo "$response" | jq -r ".result[0].results[-1].fat_ratio | ${round2}")
            latest_muscle=$(echo "$response" | jq -r ".result[0].results[-1].muscle_mass | ${round2}")
            echo "latest_weight=${latest_weight}" >> "$GITHUB_OUTPUT"
            echo "latest_fat_ratio=${latest_fat_ratio}" >> "$GITHUB_OUTPUT"
            echo "latest_muscle=${latest_muscle}" >> "$GITHUB_OUTPUT"
          fi

      # 睡眠は D1 側が UPSERT (後日更新・バックフィルあり) のため、
      # 差分追記ではなく毎回全件を取得して sleep.jsonl を再生成する
      - name: Fetch sleep data from D1
        id: fetch_sleep
        run: |
          response=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database/${{ secrets.D1_DATABASE_ID }}/query" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"sql\": \"SELECT date, start_at, end_at, total_sleep_time, total_time_in_bed, sleep_efficiency, sleep_latency, wakeup_latency, waso, nb_rem_episodes, light_sleep_duration, deep_sleep_duration, rem_sleep_duration, wakeup_count, wakeup_duration, out_of_bed_count, hr_average, hr_min, hr_max, rr_average, rr_min, rr_max, snoring, snoring_episode_count, sleep_score, apnea_hypopnea_index, breathing_disturbances_intensity, night_events, stage_segments FROM sleep_summaries ORDER BY start_at ASC\"}")

          echo "$response" | jq -c '.result[0].results[]' > sleep.jsonl.new
          if [ -f sleep.jsonl ] && cmp -s sleep.jsonl sleep.jsonl.new; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm sleep.jsonl.new
          else
            mv sleep.jsonl.new sleep.jsonl
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.fetch.outputs.count != '0' || steps.fetch_sleep.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.jsonl
          if [ -f sleep.jsonl ]; then
            git add sleep.jsonl
          fi
          datetime=$(date '+%F %T')
          git commit -m "Sync metrics data from D1 on ${datetime}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        env:
          TZ: Asia/Tokyo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post on Pixela
        if: steps.fetch.outputs.count != '0'
        run: |
          date=$(date '+%Y%m%d')
          curl -X POST https://pixe.la/v1/users/yasuharu519/graphs/weight \
            -H "X-USER-TOKEN:${{ secrets.PIXELA_TOKEN }}" \
            -d "{\"date\":\"${date}\",\"quantity\":\"${{ steps.fetch.outputs.latest_weight }}\"}"
        env:
          TZ: Asia/Tokyo

      - name: Slack Notification
        if: steps.fetch.outputs.count != '0'
        uses: tokorom/action-slack-incoming-webhook@d57bf1eb618f3dae9509afefa70d5774ad3d42bf # v1.3.0
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: "Weight updated! https://yasuharu519.github.io/weight/"
          attachments: |
            [
              {
                "color": "good",
                "fields": [
                  {
                    "title": "体重",
                    "value": "${{ steps.fetch.outputs.latest_weight }} kg"
                  },
                  {
                    "title": "体脂肪率",
                    "value": "${{ steps.fetch.outputs.latest_fat_ratio }} %"
                  },
                  {
                    "title": "筋肉量",
                    "value": "${{ steps.fetch.outputs.latest_muscle }} kg"
                  }
                ]
              }
            ]
